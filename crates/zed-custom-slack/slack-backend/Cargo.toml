[workspace]

[package]
name = "slack-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json"] }
dotenv = "0.15.0"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
oauth2 = "5.0.0"
redis = { version = "0.28.2", features = ["tokio-comp", "tokio-native-tls-comp"] }
rustls = { version = "0.23", features = ["ring"] }
