<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zed Custom Auth</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #2f81f7;
            --accent-hover: #388bfd;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% -20%, #1f2937, #0d1117 80%);
        }

        .container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 600;
        }

        p {
            margin: 0 0 30px 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(47, 129, 247, 0.4);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(47, 129, 247, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zed Custom</h1>
        <p>Sign in to your enterprise workspace.</p>
        <!-- The button routes directly to the backend for the OAuth 302 redirect -->
        <a href="https://api.zedcustom.dev/auth/login" class="btn">Sign In</a>
    </div>
</body>
</html>
