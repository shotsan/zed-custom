name: Windows Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Long Paths
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true
        shell: powershell

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Bundle
        timeout-minutes: 240
        run: |
          $version = if ("${{ github.ref_name }}" -match "^v(\d+\.\d+\.\d+)") { $matches[1] } else { "0.0.0" }
          $env:RELEASE_VERSION = $version
          $env:ZED_RELEASE_CHANNEL = "stable"
          $env:ZED_WORKSPACE = (Get-Location).Path
          powershell -ExecutionPolicy Bypass -File ./script/bundle-windows.ps1 -Architecture x86_64
        env:
          ZED_BUNDLE: "true"
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          FILE_DIGEST: SHA256
          TIMESTAMP_DIGEST: SHA256
          TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com

      - name: Prepare Artifacts
        run: |
          mkdir dist
          if (Test-Path "target/Zed-x86_64.exe") {
            Copy-Item "target/Zed-x86_64.exe" "dist/"
          }
          if (Test-Path "target/zed-remote-server-windows-x86_64.zip") {
            Copy-Item "target/zed-remote-server-windows-x86_64.zip" "dist/"
          }
        shell: powershell

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x86_64
          path: dist/*

  release:
    name: Upload Windows Assets to Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p release-assets
          # Use find to pick up files from the artifact directory subfolders
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -R release-assets/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
