name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and Bundle (${{ matrix.target }})
        timeout-minutes: 150
        run: |
          ./script/bundle-mac ${{ matrix.target }}
        env:
          ZED_BUNDLE: "true"
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          # The bundle script outputs the DMG to target/<target>/release/
          # and the gz straight to target/. We just copy what's actually there.
          if [ -f "target/${{ matrix.target }}/release/Zed-"*.dmg ]; then
            cp target/${{ matrix.target }}/release/Zed-*.dmg dist/
          fi
          if [ -f "target/zed-remote-server-"*".gz" ]; then
            cp target/zed-remote-server-*.gz dist/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-macos-${{ matrix.target }}
          path: dist/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: ./script/linux

      - name: Install mold
        run: ./script/install-mold

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Build and Bundle
        timeout-minutes: 150
        run: |
          ./script/bundle-linux
        env:
          ZED_BUNDLE: "true"

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          if [ -f "target/release/zed-linux-x86_64.tar.gz" ]; then
            cp target/release/zed-linux-x86_64.tar.gz dist/
          fi
          if [ -f "target/zed-remote-server-linux-x86_64.gz" ]; then
            cp target/zed-remote-server-linux-x86_64.gz dist/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p release-assets
          # Collect all files from the various artifact folders
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -R release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
