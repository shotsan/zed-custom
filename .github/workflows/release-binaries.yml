name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          ./script/linux
          sudo apt-get install -y gettext-base # for envsubst

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and Bundle
        run: |
          ./script/bundle-linux
        env:
          ZED_BUNDLE: "true"

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp target/release/zed-linux-x86_64.tar.gz dist/
          cp target/zed-remote-server-linux-x86_64.gz dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-linux
          path: dist/*

  build-macos:
    name: Build macOS
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and Bundle (x86_64)
        timeout-minutes: 90
        run: |
          ./script/bundle-mac x86_64-apple-darwin
        env:
          ZED_BUNDLE: "true"
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and Bundle (aarch64)
        timeout-minutes: 90
        run: |
          ./script/bundle-mac aarch64-apple-darwin
        env:
          ZED_BUNDLE: "true"
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/Zed-x86_64.dmg dist/
          cp target/aarch64-apple-darwin/release/Zed-aarch64.dmg dist/
          cp target/zed-remote-server-macos-x86_64.gz dist/
          cp target/zed-remote-server-macos-aarch64.gz dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-macos
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p release-assets
          # Collect all files from the various artifact folders
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -R release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
