<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Solid, crisp brand color -->
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <style>
    /* Subtle, elegant animations */
    .draw-path {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw 4s ease-out forwards;
    }
    .fade-in {
      opacity: 0;
      animation: fadeIn 2s ease-in 2s forwards;
    }
    .breathe {
      transform-origin: center;
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes draw {
      100% { stroke-dashoffset: 0; }
    }

    @keyframes fadeIn {
      100% { opacity: 1; }
    }

    @keyframes breathe {
      0% { transform: scale(0.98); opacity: 0.9; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.98); opacity: 0.9; }
    }
  </style>

  <!-- Left Bracket (The Structure / Code) -->
  <path d="M 60 70 L 30 100 L 60 130" 
        fill="none" 
        stroke="#94A3B8" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        class="draw-path" />

  <!-- Right Bracket (The Structure / Code) -->
  <path d="M 140 70 L 170 100 L 140 130" 
        fill="none" 
        stroke="#94A3B8" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        class="draw-path" />

  <!-- Center AI Node (The Intelligence Weaving Through) -->
  <!-- A clean, continuous geometric shape combining infinity and a node -->
  <g class="fade-in breathe">
    <path d="M 75 100 C 75 80, 100 70, 100 100 C 100 130, 125 120, 125 100 C 125 80, 100 70, 100 100 C 100 130, 75 120, 75 100 Z" 
          fill="none" 
          stroke="url(#aiGradient)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <circle cx="100" cy="100" r="12" fill="url(#aiGradient)" />
  </g>

</svg>
